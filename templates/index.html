<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Costes Artículo</title>
<style>
  body { margin: 0 auto; max-width: 1180px; padding: 32px 20px;
         font: 15px/1.5 system-ui, sans-serif; color: #222; }
  h1 { font-size: 20px; margin: 0 0 20px; }
  input { width: 100%; max-width: 640px; padding: 10px 12px; font-size: 15px;
          border: 1px solid #ccc; border-radius: 6px; }
  input:focus { outline: 2px solid #2563eb; border-color: #2563eb; }
  #results { border: 1px solid #ddd; border-top: 0; margin-top: -1px; max-width: 640px;
             max-height: 300px; overflow-y: auto; display: none; }
  #results.show { display: block; }
  #results div { padding: 8px 12px; cursor: pointer; border-top: 1px solid #eee; }
  #results div:hover { background: #f0f4ff; }
  .code { font-family: ui-monospace, monospace; color: #2563eb; }

  #head { margin: 24px 0 6px; display: none; }
  #head.show { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  #head b { font-size: 16px; }
  #head #meta { color: #555; font-size: 13px; }
  button { padding: 7px 14px; border: 0; border-radius: 6px;
           background: #2563eb; color: #fff; font-size: 14px; cursor: pointer; }
  button.ghost { background: #eef2ff; color: #2563eb; padding: 5px 10px; font-size: 13px; }
  #dl { margin-left: auto; }
  #tools { display: none; gap: 8px; margin: 10px 0 4px; }
  #tools.show { display: flex; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; display: none; }
  table.show { display: table; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #eee; }
  th { color: #0f172a; font-size: 13.5px; font-weight: 700; background: #eef2f7;
       border-bottom: 2px solid #94a3b8; padding: 10px 10px; white-space: nowrap; }
  tr.totrow td { background: #f1f5f9; font-weight: 700; font-size: 14.5px;
                 border-top: 2px solid #94a3b8; padding: 11px 10px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.branch { cursor: pointer; }
  tr.branch:hover td { background: #f7f9ff; }
  tr.branch td.name { font-weight: 600; }
  tr.mp td { background: #fef3c7; }
  tr.sinprecio td { background: #fde0e0; }
  tr.sinprecio td:first-child { box-shadow: inset 3px 0 0 #dc2626; }
  tr.conjunto td { background: #ede9fe; }
  tr.conjunto td:first-child { box-shadow: inset 3px 0 0 #7c3aed; }
  tr.noesc td { background: #dbeafe; }
  tr.noesc td:first-child { box-shadow: inset 3px 0 0 #2563eb; }
  tr.notiempo td { background: #dbeafe; }
  tr.notiempo td:first-child { box-shadow: inset 3px 0 0 #2563eb; }
  .tblwrap { overflow-x: auto; }
  .badge-c { font-size: 10.5px; padding: 1px 6px; border-radius: 999px; background: #ede9fe; color: #6d28d9; }
  .badge-s { font-size: 10.5px; padding: 1px 6px; border-radius: 999px; background: #dbeafe; color: #1d4ed8; }
  /* compra valorada pero sin tipo de aprovisionamiento en el ERP */
  .badge-t { font-size: 10.5px; padding: 1px 6px; border-radius: 999px; background: #fef3c7; color: #92400e; }
  .arrow { display: inline-block; width: 12px; color: #999; font-size: 11px; }
  .arrow.leaf { color: transparent; }

  .alert { position: fixed; top: 84px; right: 14px; width: 238px; max-height: 74vh;
           overflow: auto; background: #fff; border: 1px solid #fecaca; border-radius: 10px;
           box-shadow: 0 10px 30px rgba(0,0,0,.13); padding: 12px; display: none; z-index: 20; }
  .alert.show { display: block; }
  .alert h3 { margin: 0 0 8px; font-size: 13px; color: #b91c1c; }
  .alert .it { padding: 6px 4px; cursor: pointer; border-top: 1px solid #f3f4f6; }
  .alert .it:hover { background: #fff1f2; }
  .alert .c { font-family: ui-monospace, monospace; font-size: 12px; color: #2563eb; }
  .alert .b { font-size: 10px; color: #b91c1c; background: #fee2e2; padding: 1px 6px; border-radius: 999px; }
  .alert .d { font-size: 12.5px; color: #444; }
  tr.flash td { animation: flash 1.4s ease; }
  @keyframes flash { 0%, 45% { background: #fca5a5; } 100% { background: transparent; } }
  @media (max-width: 1560px) { .alert { position: static; width: auto; max-height: none; margin: 12px 0; } }
</style>
</head>
<body>
  <h1>Costes Artículo
    <a href="/lote" style="float:right;font-size:13px;font-weight:400;color:#2563eb;text-decoration:none">Coste por lote →</a>
  </h1>

  <input id="q" type="text" placeholder="Busca por código o descripción…" autocomplete="off">
  <div id="results"></div>

  <div id="head">
    <b id="title"></b><span id="meta"></span>
    <button id="dl">Descargar Excel</button>
    <button id="dlesc" class="ghost">Escandallo</button>
  </div>
  <div id="tools">
    <button class="ghost" id="expand">Desplegar todo</button>
    <button class="ghost" id="collapse">Plegar todo</button>
  </div>
  <div class="tblwrap">
  <table id="tbl">
    <thead><tr>
      <th>Nivel</th><th>Componente</th><th>IdArticulo</th>
      <th class="num">Cant</th><th>Ud</th><th>Tipo</th>
      <th class="num">Precio €</th><th class="num">Coste MP €</th>
      <th class="num">Tiempo min</th><th class="num">Tiempo total min</th>
      <th class="num">Coste op €</th><th class="num">Coste total €</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  </div>

  <div id="alert" class="alert"></div>

<script>
const q = document.getElementById('q'), results = document.getElementById('results');
const head = document.getElementById('head'), tools = document.getElementById('tools');
const tbl = document.getElementById('tbl'), tbody = document.getElementById('tbody');
let timer = null, current = null;
let rows = [], byId = {};              // filas aplanadas del arbol
const collapsed = new Set();

q.addEventListener('input', () => {
  clearTimeout(timer);
  if (q.value.trim().length < 2) return results.classList.remove('show');
  timer = setTimeout(buscar, 220);
});
document.addEventListener('click', e => {
  if (!results.contains(e.target) && e.target !== q) results.classList.remove('show');
});

async function buscar() {
  const data = await (await fetch('/api/buscar?q=' + encodeURIComponent(q.value.trim()))).json();
  results.innerHTML = data.length
    ? data.map(a => `<div data-c="${a.IdArticulo}" data-d="${esc(a.Descrip||'')}">
        <span class="code">${a.IdArticulo}</span> — ${esc(a.Descrip||'')}</div>`).join('')
    : '<div style="color:#999">Sin resultados</div>';
  results.querySelectorAll('div[data-c]').forEach(el =>
    el.addEventListener('click', () => cargar(el.dataset.c, el.dataset.d)));
  results.classList.add('show');
}

async function cargar(codigo, desc) {
  results.classList.remove('show');
  q.value = codigo + ' — ' + desc;
  current = codigo;
  document.getElementById('title').textContent = codigo + ' · ' + desc;
  document.getElementById('meta').textContent = 'Cargando…';
  head.classList.add('show');
  const data = await (await fetch('/api/desglose?codigo=' + encodeURIComponent(codigo))).json();
  if (!data.arbol) {
    document.getElementById('meta').textContent = 'Sin despiece';
    tbl.classList.remove('show'); tools.classList.remove('show'); return;
  }
  document.getElementById('meta').innerHTML =
    data.lineas + ' líneas · ' + data.niveles + ' niveles &nbsp;·&nbsp; '
    + 'material <b>' + eur(data.coste_material) + ' €</b> · operación <b>' + eur(data.coste_operacion) + ' €</b> · '
    + 'total <b>' + eur(data.coste_total) + ' €</b>'
    + (data.sin_precio ? ' · ⚠ ' + data.sin_precio + ' sin precio' : '');

  // aplanar el arbol en filas (orden pre-order) con profundidad y parentesco
  rows = []; byId = {}; collapsed.clear();
  const holes = {}, sinEsc = {}, deConj = {}, sinTiempo = {};
  let idc = 0;
  const bump = (bag, n, id) => (bag[n.id] || (bag[n.id] = { id: n.id, nombre: n.nombre, tipo: n.tipo, rowId: id, veces: 0 })).veces++;
  (function flat(nodes, depth, parent) {
    for (const n of nodes) {
      const id = idc++;
      const kids = n.hijos && n.hijos.length;
      rows.push(byId[id] = { _id: id, _parent: parent, _depth: depth, _kids: !!kids, n });
      if (kids) {                                                      // rama = pieza fabricada
        collapsed.add(id); flat(n.hijos, depth + 1, id);
        if (n.sin_tiempo) bump(sinTiempo, n, id);                      // fabricada sin tiempo de bono
      }
      else if (n.de_conjunto) bump(deConj, n, id);                     // pieza de conjunto
      else if (n.sin_escandallo) bump(sinEsc, n, id);                  // pieza fabricada sin fase activa
      // hueco REAL = no hay precio de albaran con el que costear. El tipo ya no
      // se exige para valorar, asi que su falta no es un hueco de coste.
      // Tampoco se mira el importe: un coste de fraccion de centimo es legitimo.
      else if (n.precio == null) bump(holes, n, id);
    }
  })(data.arbol.hijos.length ? data.arbol.hijos : [data.arbol], 0, null);

  tbody.innerHTML = rows.map(renderRow).join('')
    + `<tr class="totrow">
        <td colspan="7" style="text-align:right">TOTAL</td>
        <td class="num">${eur(data.coste_material)}</td>
        <td></td>
        <td class="num">${t2(data.tiempo_total)}</td>
        <td class="num">${eur(data.coste_operacion)}</td>
        <td class="num">${eur(data.coste_total)} €</td>
      </tr>`;
  tbl.classList.add('show'); tools.classList.add('show');
  refresh();
  renderAlert(Object.values(holes), Object.values(sinEsc), Object.values(deConj), Object.values(sinTiempo));
}

function renderAlert(holes, sinEsc, deConj, sinTiempo) {
  const el = document.getElementById('alert');
  if (!holes.length && !sinEsc.length && !deConj.length && !sinTiempo.length) { el.classList.remove('show'); el.innerHTML = ''; return; }
  const item = (x, badge) => `<div class="it" data-row="${x.rowId}">
      <span class="c">${x.id}</span> ${badge}
      ${x.veces > 1 ? '<span class="b" style="background:#f3f4f6;color:#666">×' + x.veces + '</span>' : ''}
      <div class="d">${esc(x.nombre || '')}</div></div>`;
  let html = '';
  if (holes.length) html += '<h3>⚠ Sin coste · ' + holes.length + '</h3>'
    + holes.map(x => item(x, `<span class="b">${x.tipo ? 'sin precio' : 'sin tipo'}</span>`)).join('');
  if (sinTiempo.length) html += '<h3 style="color:#1d4ed8;margin-top:14px">◷ Sin tiempo de operación · ' + sinTiempo.length + '</h3>'
    + sinTiempo.map(x => item(x, '<span class="b" style="background:#dbeafe;color:#1d4ed8">sin tiempo</span>')).join('');
  if (sinEsc.length) html += '<h3 style="color:#1d4ed8;margin-top:14px">◆ Sin escandallo · ' + sinEsc.length + '</h3>'
    + sinEsc.map(x => item(x, '<span class="badge-s">sin escandallo</span>')).join('');
  if (deConj.length) html += '<h3 style="color:#6d28d9;margin-top:14px">◆ De conjunto · ' + deConj.length + '</h3>'
    + deConj.map(x => item(x, '<span class="badge-c">conjunto</span>')).join('');
  el.innerHTML = html;
  el.classList.add('show');
  el.querySelectorAll('.it').forEach(it => it.addEventListener('click', () => reveal(+it.dataset.row)));
}

// abre los ancestros y salta a la fila resaltandola
function reveal(id) {
  let p = byId[id]._parent;
  while (p != null) { collapsed.delete(p); p = byId[p]._parent; }
  refresh();
  const tr = document.getElementById('r' + id);
  if (tr) {
    tr.scrollIntoView({ block: 'center', behavior: 'smooth' });
    tr.classList.remove('flash'); void tr.offsetWidth; tr.classList.add('flash');
  }
}

function renderRow(r) {
  const n = r.n, hoja = !r._kids;
  const cls = !hoja ? ('branch' + (n.sin_tiempo ? ' notiempo' : ''))
    : n.de_conjunto ? 'conjunto'
    : n.sin_escandallo ? 'noesc'
    : (n.tipo && n.precio != null) ? 'mp' : 'sinprecio';
  const arrow = r._kids ? '▸' : '•';
  const tipoCell = n.de_conjunto ? '<span class="badge-c">de conjunto</span>'
    : n.sin_escandallo ? '<span class="badge-s">sin escandallo</span>'
    // el artículo buscado puede llevar un trabajo propio (lacado, zincado,
    // remachado...) que se suma al coste de sus materiales
    : n.servicio != null ? '<span class="badge-t">trabajo sobre la pieza</span>'
    : !hoja ? '<span style="color:#888;font-size:12px">fabricado</span>'
    // compra valorada por albarán a la que le falta el tipo en el ERP
    : !n.tipo && n.precio != null ? '<span class="badge-t">compra sin tipo</span>'
    : esc(n.tipo || '');
  // celda de tiempo: min de operación (ramas); aviso si es fabricado sin tiempo
  const tiempoCell = hoja ? '' : (n.sin_tiempo
      ? '<span style="color:#2563eb;font-size:11px">sin tiempo</span>'
      : n.tiempo != null ? t2(n.tiempo)
      // fase declarada "Sin operación": no lleva mano de obra, no es un hueco
      : n.sin_operacion ? '<span style="color:#94a3b8;font-size:11px">sin operación</span>'
      : '');
  return `<tr id="r${r._id}" class="${cls}" data-id="${r._id}">
    <td>${r._depth}</td>
    <td class="name" style="padding-left:${6 + r._depth * 16}px">
      <span class="arrow ${r._kids ? '' : 'leaf'}">${arrow}</span>${esc(n.nombre || '')}</td>
    <td class="code">${n.id}</td>
    <td class="num">${fmt(n.cant)}</td>
    <td>${esc(n.unidad || '')}</td>
    <td>${tipoCell}</td>
    <td class="num">${hoja ? (eur(n.precio) + (n.fuente === 'lista' ? ' <span style="color:#7c3aed;font-size:10px">lista</span>' : ''))
                            : (n.servicio != null ? eur(n.servicio) : '')}</td>
    <td class="num">${eur(n.coste_mat)}</td>
    <td class="num">${tiempoCell}</td>
    <td class="num">${n.tiempo_op_total ? t2(n.tiempo_op_total) : ''}</td>
    <td class="num">${!hoja ? eur(n.coste_op) : ''}</td>
    <td class="num">${eur(n.coste_total)}</td>
  </tr>`;
}

// visible si ningun ancestro esta plegado
function visible(r) {
  let p = r._parent;
  while (p != null) { if (collapsed.has(p)) return false; p = byId[p]._parent; }
  return true;
}
function refresh() {
  for (const r of rows) {
    const tr = document.getElementById('r' + r._id);
    tr.style.display = visible(r) ? '' : 'none';
    if (r._kids) tr.querySelector('.arrow').textContent = collapsed.has(r._id) ? '▸' : '▾';
  }
}

tbody.addEventListener('click', e => {
  const tr = e.target.closest('tr.branch');
  if (!tr) return;
  const id = +tr.dataset.id;
  collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id);
  refresh();
});
document.getElementById('expand').addEventListener('click', () => { collapsed.clear(); refresh(); });
document.getElementById('collapse').addEventListener('click', () => {
  rows.forEach(r => { if (r._kids) collapsed.add(r._id); }); refresh();
});

document.getElementById('dl').addEventListener('click', () => {
  if (current) window.location = '/api/excel?codigo=' + encodeURIComponent(current);
});
document.getElementById('dlesc').addEventListener('click', () => {
  if (current) window.location = '/api/escandallo?codigo=' + encodeURIComponent(current);
});
const fmt = n => (n==null ? '' : (+n).toLocaleString('es-ES', {maximumFractionDigits: 6}));
const t2  = n => (n==null ? '' : (+n).toLocaleString('es-ES', {maximumFractionDigits: 2}));
// 4 decimales, pero si el importe no es cero y aun asi se veria como "0,0000"
// se muestran mas: un coste minimo no debe parecer coste cero.
const eur = n => {
  if (n == null) return '';
  const v = +n;
  const dec = (v !== 0 && Math.abs(v) < 0.00005) ? 6 : 4;
  return v.toLocaleString('es-ES', {minimumFractionDigits: 4, maximumFractionDigits: dec});
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
</script>
</body>
</html>
